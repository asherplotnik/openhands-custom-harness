[project]
name = "bank-agent"
version = "0.1.0"
description = "Minimal local OpenHands coding-agent prototype"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openhands-sdk",
    "openhands-tools",
]

[project.scripts]
bank-agent = "bank_agent.main:main"

[tool.setuptools.packages.find]
include = ["bank_agent*"]

[tool.uv]
package = true
exclude-newer = "7 days"
exclude-newer-package = { litellm = "2026-09-07T00:00:00Z", lmnr = "2026-08-23T00:00:00Z" }
constraint-dependencies = [
    "starlette>=0.49.1",
    "aiohttp>=3.13.3",
    "urllib3>=2.6.3",
    "protobuf>=6.33.5",
    "pillow>=12.3.0",
    "orjson>=3.11.7",
    "rich>=14.3.3",
    "lupa>=2.8",
    # The remediation repository pins 1.93.0. That release is source-only on
    # Windows and requires the MSVC linker. 1.100.0 is explicitly pinned here
    # for the local prototype because it has a compatible Windows wheel.
    # It must be SCA-reviewed before this package enters the bank environment.
    "litellm==1.100.0",
]

[tool.uv.sources]
openhands-sdk = { path = "vendor/openhands-sdk", editable = true }
openhands-tools = { path = "vendor/openhands-tools", editable = true }
